name: Desktop app (Windows and Mac)

# Builds the desktop app with web-terrarium on a Windows and a Mac runner, checks that it starts,
# and uploads the zips. On a v* tag, also attaches them to that tag's GitHub Release.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to attach the zips to a release on v* tags
  pull-requests: write # to comment the download links on pull requests

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: Restaurant Reviews # `name` in terrarium.config.mjs
  # Packaging downloads the Electron it packs; the runtime `npm ci` would download isn't needed.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  build:
    name: Build the ${{ matrix.label }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows, suffix: win }
          - { os: macos-latest, label: Mac, suffix: mac }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the desktop app
        run: npm run desktop:build # prepares the PGlite database first
        env:
          # The Mac app is ad-hoc signed (no certificate); electron-builder skips that on PRs otherwise.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Find the zip
        id: zip
        run: echo "path=$(ls dist-desktop/out/*-${{ matrix.suffix }}.zip)" >> "$GITHUB_OUTPUT"
      # Unzip, launch, wait for "[web-terrarium] app ready at <url>" in servers.log, load the
      # page, then quit.
      - name: Smoke test
        run: |
          app="$RUNNER_TEMP/app"
          mkdir -p "$app"
          if [ "${{ matrix.suffix }}" = win ]; then
            # Git Bash's tar can't read zips; its unzip can.
            unzip -q "${{ steps.zip.outputs.path }}" -d "$app"
            log="$APPDATA/$APP_NAME/servers.log"
            "$app/$APP_NAME.exe" &
          else
            # ditto keeps the .app bundle's symlinks and file modes.
            ditto -x -k "${{ steps.zip.outputs.path }}" "$app"
            log="$HOME/Library/Application Support/$APP_NAME/servers.log"
            "$app/$APP_NAME.app/Contents/MacOS/$APP_NAME" &
          fi
          for _ in $(seq 1 90); do
            grep -qE 'app ready at|exit code' "$log" 2>/dev/null && break
            sleep 1
          done
          cat "$log" || true
          url=$(grep -o 'app ready at http://[0-9.:]*' "$log" | sed 's/app ready at //')
          test -n "$url" || { echo "::error::The app did not start"; exit 1; }
          curl -fsS -o /dev/null "$url/"
          echo "The app answered at $url"
          if [ "${{ matrix.suffix }}" = win ]; then
            taskkill //IM "$APP_NAME.exe" //T //F
          else
            pkill -f "$APP_NAME.app/Contents/MacOS" || true
          fi
      # archive: false uploads the zip as it is, so the download is the app's zip itself (named
      # after the file, e.g. Restaurant-Reviews-1.0.0-win.zip), not a zip inside GitHub's own zip.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The first of the two jobs creates the release; both upload their zip.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ||
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" --clobber

  # One comment on the pull request with links to download the zips, updated on every push.
  # Skipped for pull requests from forks, whose token can't comment.
  comment:
    name: Comment the download links
    needs: build
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.build.result }}
        run: |
          marker='<!-- desktop-app-builds -->'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          links=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '
            .artifacts | sort_by(.name)[] |
            (if (.name | contains("-win")) then "Windows" else "Mac" end) as $os |
            "- **\($os):** [\(.name)]('"$run_url"'/artifacts/\(.id)) (\(.size_in_bytes / 1048576 | floor) MB)"')
          if [ "$RESULT" = success ]; then
            status="Built and smoke-tested on Windows and Mac."
          else
            status="⚠️ A build or smoke test failed ($RESULT). See [the run]($run_url)."
          fi
          body="$marker
          ### Desktop app builds for ${SHA:0:7}

          ${links:-No zips were uploaded.}

          $status Download while signed in to GitHub; kept for 30 days. Unzip, then run the app inside."
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
